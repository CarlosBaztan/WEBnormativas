baseURL = "https://cocheapto.com/"
locale = "es-es"
defaultContentLanguage = "es"

# Sin esto, un `date: 2026-09-29` del front matter se interpreta como
# medianoche UTC, que en Espana son las 02:00. Una ficha creada de
# madrugada queda "en el futuro" y buildFuture = false la descarta en
# silencio: la pagina no se genera y nadie se entera.
timeZone = "Europe/Madrid"
# La marca, desde el 01/10/2026. Antes era "Normativa del vehiculo en Espana",
# que describia bien pero no se recordaba ni se citaba. Esa frase no se pierde:
# sigue siendo la descripcion del sitio y el titulo que ve quien pasa el raton
# por el logotipo.
#
# OJO: el <title> de la portada lo arma layouts/partials/head.html, que es una
# copia del de PaperMod con un unico cambio. El original ponia solo site.Title
# en la portada, y eso dejaria la pagina mas importante del sitio titulada
# "Coche Apto" a secas, sin una palabra de lo que se hace aqui.
title = "Coche Apto"
theme = "PaperMod"

enableRobotsTXT = true
enableGitInfo = false
buildDrafts = false
buildFuture = false
buildExpired = false

# Sin taxonomías: generaban páginas vacías e indexables (/tags/, /categories/,
# y una /etiquetas-dgt/ rota que esperaba la clave `etiqueta` cuando el
# archetype usa `etiquetas_permitidas`, que es un array).
# OJO: esta clave debe ir en la RAÍZ, antes de cualquier cabecera [tabla].
# Si se coloca después, TOML la anida dentro de esa tabla y deja de aplicarse.
disableKinds = ["taxonomy", "term"]

# Regla dura 1: un dato sin verificar no se publica.
# Convención: estado_dato = pendiente  <=>  draft = true
# El script pipeline/auditoria.py comprueba que ambos no se desincronicen.

[pagination]
  pagerSize = 20
  # Hugo generaba /datos/page/1/, /legal/page/1/ y /multas/page/1/, las tres
  # secciones que caen en el list.html del tema, que pagina. La primera pagina
  # de un paginador es siempre un duplicado de la propia seccion: mismo
  # contenido, otra URL. No estaban en el sitemap y su canonico apuntaba bien,
  # asi que Google consolidaba, pero salian ademas SIN menu lateral, o sea sin
  # forma de salir de ahi.
  #
  # Lo destapo la prueba del menu el 08/10/2026, al cambiar un `continue`
  # silencioso por un `assert`: hasta entonces esas tres paginas se saltaban
  # sin comprobar nada y nadie sabia que existian.
  disableAliases = true

[minify]
  disableXML = true
  minifyOutput = true

[params]

  # ABIERTO A LOS BUSCADORES desde el 01/10/2026.
  #
  # Decisión de Carlos, que pidió tener la web activa ese mismo día. Yo había
  # recomendado esperar a más fichas verificadas; con lo que hay medido, su
  # criterio se sostiene y el mío era conservador de más.
  #
  # Lo que se comprobó antes de abrir, y conviene repetirlo si algún día se
  # vuelve a cerrar y abrir:
  #
  #   - 37 páginas en el sitemap, 29.292 palabras, mediana de 589 por página.
  #     No es un sitio delgado.
  #   - Ni un título duplicado, ni una descripción duplicada, ni una página
  #     sin <title>.
  #   - 1.208 enlaces internos y ninguno roto.
  #   - Páginas legales publicadas, con los datos reales del titular.
  #   - La sección /guias/ estaba vacía (trece palabras) y se pasó a borrador,
  #     y se quitó su entrada del menú.
  #   - El buscador interno salió del sitemap: emitía noindex y a la vez se
  #     pedía su rastreo.
  #
  # Si hay que volver a cerrarlo, esto a true y desplegar.
  noindex = false

  # El feed de portada solo muestra estas secciones. Sin esto, las páginas
  # legales (aviso legal, cookies, contacto) aparecen como si fueran artículos.
  mainSections = ["zbe", "etiquetas", "guias"]

  # OJO: no fijar env = "production" aquí. Hacerlo obliga a TODOS los builds
  # (incluidas las previsualizaciones de Cloudflare) a emitir "index, follow".
  # PaperMod ya usa hugo.Environment, que vale "production" con `hugo` y
  # "development" con `hugo server`.
  description = "Normativa, fiscalidad y trámites del vehículo en España. Datos oficiales verificados y fechados."
  # Se queda con el nombre de la marca. Hasta el 05/10/2026 decia
  # "Normativa del vehiculo", que era el nombre VIEJO del sitio: al
  # cambiar la marca el 01/10 se cambio site.Title y este se quedo
  # atras, y salia en <meta name=author> de las 42 paginas y como
  # autor en el JSON-LD. Un autor que ya no existe no es una firma.
  author = "Coche Apto"
  defaultTheme = "auto"
  ShowReadingTime = false
  # Bajo cada tarjeta de las listas salia "23 de septiembre de 2026 ·
  # Normativa del vehiculo": el nombre del propio sitio en el que ya estas, y
  # una fecha que NO es la de verificacion, que es la unica que importa aqui y
  # que va en su recuadro dentro de cada ficha. Dos datos que no aportan y una
  # fecha que se puede confundir con la que si cuenta.
  hideMeta = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  TocOpen = false
  disableSpecial1stPost = true
  hidemeta = false
  comments = false

  # Hueco de anuncio: SOLO debajo del resultado de la herramienta.
  # Regla dura 4: cero anuncios encima del formulario.
  adsEnabled = false

  # ------------------------------------------------------------------
  # OJO, LEER ANTES DE TOCAR NADA DE AQUI ABAJO
  #
  # A partir de esta linea empiezan las cabeceras [params.loquesea]. En
  # TOML, una cabecera abre un ambito que dura hasta la siguiente, asi que
  # cualquier `clave = valor` suelto que se escriba de aqui en adelante NO
  # sera un ajuste de [params]: quedara dentro de la ultima tabla abierta.
  #
  # Paso el 01/10/2026. Este bloque del buscador se inserto arriba, justo
  # detras de [params], y se trago los diecisiete ajustes que lo seguian.
  # La web se desplego sin migas de navegacion ni enlaces de anterior y
  # siguiente en sus 37 paginas, con el autor vacio y con el titulo del
  # logotipo partido en "Coche Apto:  (Alt + H)". El build salio en verde.
  #
  # Regla: los ajustes sueltos van ARRIBA; las tablas, aqui abajo.
  # Lo vigila pipeline/test_configuracion.py.
  # ------------------------------------------------------------------

  # ------------------------------------------------------------------
  # BUSCADOR INTERNO (Fuse.js)
  #
  # Sin esta seccion corria con los valores de serie de PaperMod, y buscar
  # "granada" devolvia la ficha de Malaga (correcto, la menciona) pero tambien
  # "Etiqueta C", "Etiqueta 0 emisiones", Barcelona y Madrid Distrito Centro,
  # que NO contienen esa palabra por ningun lado.
  #
  # La causa es `threshold = 0.4`: Fuse admite coincidencias con hasta un 40 %
  # de diferencia. En un buscador de prosa general eso perdona erratas; en un
  # sitio donde se buscan nombres de municipio y de distintivo, convierte
  # cualquier consulta en una lista de casi todo.
  #
  # threshold 0.2        tolera una errata corta, no media palabra.
  # minMatchCharLength 3 una o dos letras ya no disparan resultados.
  # ignoreLocation       que la palabra este al final de una ficha larga no
  #                      la penaliza: aqui importa si aparece, no donde.
  # keys con peso        el titulo manda. Que una ficha se LLAME "Granada"
  #                      pesa mucho mas que mencionarlo de pasada, y eso es
  #                      justo lo que no ordenaba bien.
  #
  # Los pesos se eligieron midiendo, no a ojo. Con 0,6 / 0,25 / 0,15 la
  # busqueda "multa" ponia la ficha de Valencia por delante de la pagina que
  # SE LLAMA "Multa por entrar en una ZBE". Con 0,8 / 0,15 / 0,05 eso se
  # arregla y el resto de consultas no empeora. El contenido sigue contando:
  # una pagina que menciona Granada de pasada aparece, pero debajo.
  #
  # Y threshold 0,2 sigue perdonando erratas: "granda" encuentra Granada y
  # "malaga" sin tilde encuentra Malaga. Comprobado contra el indice real.
  # ------------------------------------------------------------------
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    ignoreLocation = true
    threshold = 0.2
    minMatchCharLength = 3
    distance = 200
    limit = 12

    [[params.fuseOpts.keys]]
      name = "title"
      weight = 0.8

    [[params.fuseOpts.keys]]
      name = "summary"
      weight = 0.15

    [[params.fuseOpts.keys]]
      name = "content"
      weight = 0.05

  [params.homeInfoParams]
    Title = "¿Puedes circular por la ZBE de tu ciudad?"
    Content = "Consulta las restricciones reales de cada municipio, con la ordenanza citada y la fecha en que se verificó."

[menu]
  [[menu.main]]
    identifier = "zbe"
    name = "ZBE"
    url = "/zbe/"
    weight = 10
  [[menu.main]]
    identifier = "etiquetas"
    name = "Etiquetas DGT"
    url = "/etiquetas/"
    weight = 20
  [[menu.main]]
    identifier = "datos"
    name = "Datos abiertos"
    url = "/datos/"
    weight = 30
  # La entrada de "Guías" estuvo aquí y se ha quitado el 01/10/2026, al abrir
  # el sitio a Google. La sección existe pero está vacía: un enlace del menú
  # principal que lleva a una página con trece palabras es malo para quien
  # navega y es justo el tipo de página delgada que conviene no publicar.
  # Se devuelve cuando haya guías que enseñar.


[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

# Vacío a propósito: anula las taxonomías por defecto de Hugo (tags, categories).
[taxonomies]

# El sitemap usa la fecha de verificación como señal de frescura:
# es el único dato de actualidad real que tiene el proyecto.
[frontmatter]
  lastmod = ["fecha_verificacion", ":git", "lastmod", "date", "publishDate"]

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5
